# Test profile: use an in-memory H2 database instead of Postgres,
# so "./mvnw test" works on any machine (for example Jenkins).
# MODE=PostgreSQL makes H2 accept Postgres syntax like SERIAL.
# CASE_INSENSITIVE_IDENTIFIERS lets "description" (from @Column) match the
# DESCRIPTION column, because H2 stores names in upper case (Postgres: lower case).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql on the H2 database too
spring.sql.init.mode=always
