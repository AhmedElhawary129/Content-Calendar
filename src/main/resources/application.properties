spring.application.name=content-calendar
server.port=${PORT:8080}
#spring.h2.console.enabled=true
#spring.datasource.generate-unique-name=false
#spring.datasource.name= content

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password

spring.sql.init.mode=always

#logging.level.org.springframework.jdbc=DEBUG

#cc.welcomeMessage=Welcome! Built automatically by Jenkins.
cc.welcomeMessage=Welcome to the Content Calendar Application.
cc.about=This application is designed to help you manage and schedule your content effectively. You can create, edit, and track your content calendar with ease.

spring.profiles.active=dev

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET:dev-secret-key-change-me-it-must-be-at-least-32-chars}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}